name: FEXTendo package and release

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate complete SD package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install package verifier
        run: python3 -m pip install -r requirements.txt
      - name: Test package and release guards
        run: python3 -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: Set package version
        id: version
        run: python3 tools/release_ci.py version
      - name: Download approved production runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_ci.py fetch --output .cache/release
      - name: Assemble and verify NRO, NSP and SD layout
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release_package.py \
            --runtime .cache/release/fextendo-runtime-production-v1.zip \
            --output dist/release \
            --version "$PACKAGE_VERSION" \
            --commit "$GITHUB_SHA"
      - name: Upload downloadable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FEXTendo-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tag and release
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: fextendo-release-${{ github.repository }}-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: FEXTendo-${{ needs.package.outputs.version }}
          path: dist/release
      - name: Publish verified assets with automatic changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.version }}
        run: python3 tools/release_ci.py publish --input dist/release --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
