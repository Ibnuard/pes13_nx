# PES13-NX unified boolean configuration template.
#
# PERF34 reads this file from switch/pes13-nx/configuration.ini.  Hyphens in
# legacy flag names become underscores, and values accept 0/1, true/false,
# yes/no, on/off, run, enabled, or disabled.  The old *.txt files are only a
# compatibility fallback for older SD packages.
production=1
profile=0
no_balance=0
verbose=0
gl_uncached=0
gl_noclean=0
gl_clean_test=0
controller_keyboard=0
controller_gamepad=0
controller_trace=0
controller_test=0
no_display_devices=0
framebuffer=0
vulkan_probe=0

# PERF33 FASTMATH policy used by the PERF34 config package.
perf8_turbo=0
perf17_capture=1
perf17_hotblocks=0
perf18_roundguard=0
perf19_matrix=1
perf20_fusion=1
perf21_fastmath=1
perf22_floatmath=0
perf23_balance=1
perf25_paircopy=1
perf32_blocks=1
perf33_blocks=1
