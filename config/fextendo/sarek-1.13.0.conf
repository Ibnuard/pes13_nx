# FEXTendo Sarek trial: preserve VSync, quality and the two-frame queue.
# Sarek 1.13.0 treats -1 as a one-second soft cap; 0 disables this limiter
# at our presentInterval=1. VSync remains enabled below.
d3d9.maxFrameRate = 0
d3d9.presentInterval = 1
d3d9.maxFrameLatency = 2

d3d9.deviceLocalConstantBuffers = False
d3d9.samplerAnisotropy = 0
d3d9.memoryTrackTest = False

# Sarek has separate state-cache and shader compiler worker pools.
dxvk.numCompilerThreads = 1
dxvk.numShaderCompilerThreads = 1
dxvk.enableStateCache = True
dxvk.shaderCompilationMethod = "dyasync"
dxvk.framePace = "max-frame-latency"
