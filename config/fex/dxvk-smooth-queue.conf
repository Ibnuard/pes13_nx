# Pacing candidate: allow up to two frames in flight to absorb short CPU delays.
# DXVK also respects the application's frame-latency and backbuffer limits.
# Keep FIFO synchronization; do not add a translated frame limiter.
d3d9.maxFrameRate = -1
d3d9.presentInterval = 1
d3d9.maxFrameLatency = 2

d3d9.deviceLocalConstantBuffers = False
d3d9.samplerAnisotropy = 0
d3d9.memoryTrackTest = False
dxvk.numCompilerThreads = 1
