# PES13-NX FEX3. This prefix is switch/pes13-fex/.
# 1 = original x86 worker/SMC/exception test; 0 = launch C:\PES13\pes2013.exe.
# Run the test once before switching this experimental package to PES.
run_guest_tests=1
production=1
profile=0
no_balance=0
controller_keyboard=0
controller_gamepad=0
controller_trace=0
controller_test=0
no_display_devices=0
vulkan_probe=0
# Project FEX profiles: Fast uses x87 at 64-bit precision with x86 memory
# ordering; Fastest relaxes scalar/SIMD/string ordering and may break worker
# synchronization. Guest tests always use the control profile.
fex_fast=1
fex_fastest=0
# Box64 perf flags and pes2013.box64.txt do not apply to the FEX backend.
